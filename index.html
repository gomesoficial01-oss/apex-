<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<title>A.P.E.X.</title>
<style>
:root{--bg:#080d18;--p:#101a2b;--line:#243650;--t:#edf4ff;--m:#91a5c2;--c:#58d9f5;--b:#6d8cff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 80% -10%,#19375a,transparent 42%),var(--bg);color:var(--t);font:15px system-ui}
header{padding:20px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#080d18ed;z-index:2}
.logo{font-size:26px;font-weight:900;letter-spacing:5px}
.sub,.eyebrow{font-size:10px;letter-spacing:2px;color:var(--c)}
nav{display:flex;gap:7px;overflow:auto;padding-top:12px}
button{cursor:pointer}
nav button,.secondary{background:transparent;color:var(--m);border:1px solid var(--line);padding:9px 12px;border-radius:10px;white-space:nowrap}
nav button.active{color:var(--c);border-color:var(--c);background:#153047}
main{max-width:850px;margin:auto;padding:17px}
.hero,.card{border:1px solid var(--line);border-radius:15px;padding:16px;background:var(--p);margin:12px 0}
.hero{background:linear-gradient(135deg,#142944,#101a2b)}
h1{font-size:25px;margin:8px 0}
h2{font-size:18px;margin:22px 0 10px}
.muted,.label{color:var(--m);line-height:1.5}
.label,.small{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{font-size:27px;font-weight:800}
.tag{font-size:10px;color:var(--c);border:1px solid #28506a;padding:4px 8px;border-radius:20px}
.bar{height:7px;background:#26364c;border-radius:8px;margin-top:9px;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--c))}
.mission{border-left:3px solid var(--c);padding:12px;background:#0c1b2b;line-height:1.5}
input,textarea,select{width:100%;background:#091321;border:1px solid var(--line);border-radius:9px;color:var(--t);padding:11px;margin:6px 0 12px;font:inherit}
textarea{min-height:80px}
label{font-size:12px;color:var(--m)}
.primary{background:linear-gradient(90deg,#397de0,#35bcd7);border:0;color:white;font-weight:700;padding:12px 15px;border-radius:10px}
.primary:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hidden{display:none!important}
.foot{text-align:center;color:#71849f;font-size:11px;padding:22px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<div class="row">
<div>
<div class="logo">A.P.E.X.</div>
<div class="sub">PERSONAL EVOLUTION SYSTEM</div>
</div>
<span class="tag">● SISTEMA LOCAL ATIVO</span>
</div>
<nav>
<button class="active" data-tab="home">Painel</button>
<button data-tab="areas">Áreas</button>
<button data-tab="diary">Diário</button>
<button data-tab="review">Revisão</button>
</nav>
</header>
<main>
<section id="home">
<div class="hero">
<div class="eyebrow">CENTRAL DE COMANDO</div>
<h1>Construa sua próxima versão.</h1>
<p class="muted">Conhecimento aplicado. Pequenas ações consistentes. Evolução mensurável.</p>
<span class="tag" id="date"></span>
</div>
<h2>Seu progresso</h2>
<div class="grid">
<div class="card"><div class="label">Dias registrados</div><div class="metric" id="days">0</div></div>
<div class="card"><div class="label">Missões concluídas</div><div class="metric" id="done">0</div></div>
<div class="card"><div class="label">Práticas registradas</div><div class="metric" id="entries">0</div></div>
<div class="card"><div class="label">Sequência atual</div><div class="metric" id="streak">0</div></div>
</div>
